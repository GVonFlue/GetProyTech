name: Expire old previews and reports
on:
  schedule:
    - cron: '17 9 * * *'   # every day around 3:17 AM Central
  workflow_dispatch: {}     # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/expire-previews.mjs
      - name: Commit if anything was removed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "proytech-bot"
            git config user.email "admin@getproytech.com"
            git add -A previews images/previews
            git commit -m "Remove expired previews and reports"
            git push
          else
            echo "Nothing expired today"
          fi
